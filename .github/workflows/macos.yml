# The macOS jobs, apart from CI: the org's macOS runners can take long to start, and a
# job that waits too long is cancelled; here that does not mark CI failed.
name: macOS
on:
  # once per change: main (main and the tags only get commits that already ran here)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu llvm@22
      - name: Tests
        run: eskiuc test
      - name: Address sanitizer
        run: |
          # Apple's clang has an older ASan runtime than LLVM 22's instrumentation.
          export CC=$(brew --prefix llvm@22)/bin/clang
          mkdir -p build
          eskiuc --asan tests/font.esk -o build/font_asan
          build/font_asan
